# Profil production : durcissement par rapport au profil par defaut.
# Active via : -Dspring-boot.run.profiles=prod ou SPRING_PROFILES_ACTIVE=prod

# Base de donnees : aucun defaut, les vars d env sont obligatoires
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate : valide le schema mais ne le modifie pas (migration Flyway recommandee)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT : secret obligatoire, pas de defaut (fail-fast si absent)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS : a configurer selon l environnement de deploiement
app.cors.allowed-origins=${APP_CORS_ORIGINS}

# Springdoc : OpenAPI desactive en prod
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator : restreint au strict necessaire pour la sonde Docker
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Logging : niveau adapte a la prod
logging.level.root=WARN
logging.level.com.gestion_academique=INFO
