spring.application.name=backend

# Base de donnees PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_academique}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# show-sql desactive par defaut (genere du bruit en prod). Activer via profil demo si besoin.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server
server.port=8080

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Upload fichiers
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
jwt.secret=${JWT_SECRET:your-super-secret-key-change-in-production-environment-variable}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS : autorise le port Vite dev (3000) et son defaut (5173)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Spring Boot Actuator : health + info exposes pour Docker healthcheck et monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true