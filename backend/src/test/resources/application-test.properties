# Profil de test d'integration : base H2 en memoire (mode PostgreSQL pour supporter TEXT, etc.)
spring.datasource.url=jdbc:h2:mem:sygle_it;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Le schema est genere depuis les entites a chaque demarrage du contexte de test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Repertoire d'upload isole dans target/ (gitignore) pour les tests de depot de rapport
app.upload.dir=target/test-uploads

# Secret JWT factice requis par le contexte de securite (>= 32 caracteres pour HS256)
jwt.secret=integration-test-secret-key-please-change-0123456789-abcdef
jwt.expiration=86400000
jwt.refresh.expiration=604800000
